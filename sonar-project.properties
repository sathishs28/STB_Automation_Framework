sonar.projectKey=STB_Automation_Framework
sonar.projectName=STB Automation Framework
sonar.projectVersion=1.0

sonar.sources=. 
sonar.tests=tests

# Python coverage report generated by pytest-cov
sonar.python.coverage.reportPaths=coverage.xml

# Test file patterns
sonar.test.inclusions=\
**/test_*.py,\
**/*_test.py

# Exclude test files from source analysis
sonar.exclusions=\
**/tests/**,\
**/__pycache__/**,\
**/.venv/**,\
**/venv/**,\
**/htmlcov/**,\
**/.pytest_cache/**,\
**/*.pyc
**/setup_files/**,\
**/evidence/**,\
**/temp/**